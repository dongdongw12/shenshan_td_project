<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>深山传家 · 等距渲染台</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #0f1528; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
      #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
      #hud { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
             padding: 10px 14px; border-radius: 12px; background: rgba(20, 16, 12, 0.72); color: #f3ead6; font-size: 13px; backdrop-filter: blur(6px); }
      #hud label { display: inline-flex; gap: 6px; align-items: center; }
      #hud input[type=range] { width: min(46vw, 260px); accent-color: #c8a24a; }
      #hud button { background: #b8352a; color: #fff6e4; border: 0; border-radius: 8px; padding: 5px 12px; font-size: 13px; }
      #phase { min-width: 92px; font-weight: 600; letter-spacing: 0.05em; }
      #stats { opacity: 0.7; font-variant-numeric: tabular-nums; }
      #err { position: fixed; top: 12px; left: 12px; right: 12px; color: #ffb4a8; white-space: pre-wrap; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud">
      <span id="phase">白昼</span>
      <label>时辰 <input id="time" type="range" min="0" max="1000" value="0" /></label>
      <button id="play" type="button">暂停</button>
      <label>速度 <select id="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="12">12×</option></select></label>
      <label><input id="debug" type="checkbox" /> 占地框</label>
      <span id="stats"></span>
    </div>
    <div id="err"></div>
    <script type="module" src="/src/dev/main.ts"></script>
  </body>
</html>

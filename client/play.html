<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>深山传家 · 可玩演示</title>
    <!-- 顶栏 / 底栏 / 面板 / 封面都画在画布上（与微信小游戏同一套代码，见 src/app/），这里只留一块 9:16 画布 -->
    <style>
      html, body { margin: 0; height: 100%; background: #0f1528; overflow: hidden; }
      #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
      #frame { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #e9dfc6; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="frame"><canvas id="stage"></canvas></div></div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>

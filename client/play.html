<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>深山传家 · 可玩演示</title>
    <style>
      :root { --ink: #1c1510; --paper: #f1e8d4; --cinnabar: #b8352a; --gamboge: #d9a838; --azurite: #2e5f8f; }
      html, body { margin: 0; height: 100%; background: #0f1528; overflow: hidden; font-family: "PingFang SC", "Songti SC", serif; color: var(--ink); }
      #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
      #frame { position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #cdd8cf; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      .bar { position: absolute; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
             background: rgba(241, 232, 212, 0.92); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 8px; box-shadow: 0 2px 0 rgba(28,21,16,.4); }
      #top { top: 8px; font-size: 13px; justify-content: space-between; }
      #top .title { font-weight: 700; font-size: 15px; letter-spacing: .08em; }
      #top .res span { margin-right: 8px; font-variant-numeric: tabular-nums; }
      #hp { width: 100%; height: 6px; background: #d8ccb2; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
      #hp i { display: block; height: 100%; background: var(--cinnabar); width: 100%; transition: width .2s; }
      #bottom { bottom: 8px; font-size: 12px; }
      #bottom button, #panel button { font-family: inherit; font-size: 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fbf6ea; color: var(--ink);
             padding: 4px 7px; line-height: 1.25; cursor: pointer; }
      #bottom button.on { background: var(--gamboge); }
      #bottom button:disabled { opacity: .45; }
      #bottom button.primary { background: var(--cinnabar); color: #fff6e4; font-weight: 700; }
      #bottom small { display: block; opacity: .8; font-size: 10px; white-space: nowrap; }
      #bottom img.thumb { display: block; height: 30px; max-width: 46px; margin: 0 auto 1px; object-fit: contain; pointer-events: none; }
      i.ri { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.22em; margin-right: 1px; font-style: normal; }
      i.ri svg { width: 100%; height: 100%; display: block; }
      #top .res span { display: inline-flex; align-items: center; gap: 2px; }
      #toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); background: rgba(28,21,16,.85); color: #f6ecd6; padding: 6px 14px;
               border-radius: 18px; font-size: 14px; letter-spacing: .06em; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
      #panel { position: absolute; right: 8px; top: 96px; width: 46%; font-size: 12px; display: none; }
      #panel.show { display: block; }
      #family { bottom: 190px; font-size: 12px; display: none; flex-direction: column; align-items: stretch; gap: 4px; max-height: 46%; overflow-y: auto; }
      #family.show { display: flex; }
      #family .frow { line-height: 1.5; }
      #family .who { display: inline-block; min-width: 3.2em; font-weight: 700; margin-right: 6px; }
      #family small { opacity: .8; }
      #family .dim { opacity: .55; }
      #family button { font-family: inherit; font-size: 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fbf6ea; color: var(--ink); padding: 2px 7px; margin: 2px 4px 0 0; cursor: pointer; }
      #family button.on { background: var(--gamboge); }
      #banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(15,21,40,.72); color: #f6ecd6;
                font-size: 26px; letter-spacing: .2em; text-align: center; gap: 14px; }
      #banner.show { display: flex; }
      #cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 45%, rgba(241,232,212,.55), rgba(26,37,80,.55)); }
      #cover.hide { display: none; }
      .cv-card { position: relative; width: 74%; padding: 26px 18px 18px; background: rgba(241,232,212,.94); border: 3px solid var(--ink); border-radius: 6px;
                 box-shadow: 0 0 0 6px rgba(241,232,212,.9), 0 0 0 8px var(--ink), 0 10px 30px rgba(0,0,0,.35); text-align: center; }
      .cv-title { display: flex; justify-content: center; gap: .08em; font-family: "STKaiti", "Kaiti SC", "KaiTi", "Songti SC", serif; font-size: 52px; font-weight: 700; line-height: 1; color: var(--ink); letter-spacing: .02em; }
      .cv-title span:nth-child(2) { transform: translateY(6px); }
      .cv-title span:nth-child(4) { transform: translateY(-4px); }
      .cv-seal { position: absolute; right: 12px; top: 12px; width: 46px; height: 46px; background: var(--cinnabar); color: #f6ecd6; border-radius: 4px; transform: rotate(-6deg);
                 font-family: "STKaiti", "Kaiti SC", "KaiTi", serif; font-size: 15px; line-height: 21px; padding-top: 2px; box-sizing: border-box; box-shadow: inset 0 0 0 2px rgba(246,236,214,.6); }
      .cv-line { margin: 22px 0 14px; font-size: 14px; line-height: 1.8; letter-spacing: .06em; }
      #coverBtn { font-family: inherit; font-size: 17px; letter-spacing: .1em; padding: 9px 26px; border-radius: 10px; border: 2px solid var(--ink); background: var(--cinnabar); color: #fff6e4; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
      .cv-tip { margin: 12px 0 0; font-size: 11px; opacity: .65; }
      #banner button { font-size: 15px; padding: 8px 18px; border-radius: 10px; border: 2px solid #f6ecd6; background: var(--cinnabar); color: #fff6e4; font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="frame">
      <canvas id="stage"></canvas>
      <div id="top" class="bar">
        <div class="title" id="title">第一天 · 白昼</div>
        <div class="res" id="res"></div>
        <div id="hp"><i></i></div>
      </div>
      <div id="toast"></div>
      <div id="panel" class="bar"></div>
      <div id="family" class="bar"></div>
      <div id="bottom" class="bar"></div>
      <div id="banner"><div id="bannerText"></div><button id="bannerBtn" type="button">再来一局</button></div>
      <div id="cover">
        <div class="cv-card">
          <div class="cv-title"><span>深</span><span>山</span><span>传</span><span>家</span></div>
          <div class="cv-seal">开荒<br>守寨</div>
          <p class="cv-line">流落深山，白天开荒种田、攒钱娶妻生子；<br>入夜举家上楼，守住这一方寨子。</p>
          <button id="coverBtn" type="button">开 荒 ▶</button>
          <p class="cv-tip">底栏选建筑 → 点地块放置 · 拖动看地图 · 点“入夜”开战</p>
        </div>
      </div>
    </div></div>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
